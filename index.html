<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISSION: CHANGE — 우리 학교를 바꾸는 선택</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#203047;background:#f4f6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 5% 5%,#dfefff,transparent 35%),radial-gradient(circle at 90% 20%,#ffeadb,transparent 35%),#f5f6fc}.wrap{max-width:980px;margin:auto;padding:24px 18px 65px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.logo{font-weight:900;letter-spacing:.08em;color:#5255c9}.pill{border-radius:999px;padding:8px 12px;background:white;color:#6a6f8e;font-size:13px;font-weight:700}.panel{background:#fff;border:1px solid #e6e8f2;border-radius:28px;padding:clamp(22px,5vw,45px);box-shadow:0 18px 55px #34407014}.eyebrow{color:#6463c7;font-weight:800;font-size:13px;letter-spacing:.08em}.title{font-size:clamp(28px,5vw,46px);line-height:1.2;margin:12px 0}.lead{color:#69738a;font-size:17px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:25px 0}.choice{border:2px solid #e5e7f1;border-radius:20px;padding:20px;text-align:left;background:#fff;cursor:pointer;color:inherit;font:inherit;min-height:115px;transition:.15s}.choice:hover{transform:translateY(-2px);border-color:#9d9ce9}.choice.selected{border-color:#5e5cdd;background:#f2f1ff;box-shadow:0 0 0 3px #e7e5ff}.choice .emoji{font-size:31px;display:block;margin-bottom:8px}.choice strong{font-size:18px;display:block}.choice small{display:block;color:#6f7790;line-height:1.6;margin-top:6px}.btn{border:0;border-radius:15px;padding:15px 24px;font-weight:800;font-size:16px;background:#605ce2;color:white;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:#edf0fa;color:#49516c}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}.hint{padding:16px 18px;background:#f1f5ff;border-radius:16px;color:#4b5779;line-height:1.7;margin:18px 0}.crisis{background:#fff5e8;border:1px solid #f6d8ad;border-radius:20px;padding:22px;line-height:1.85;margin:22px 0}.stepper{display:flex;gap:6px;margin:20px 0}.step{flex:1;padding:10px 5px;border-radius:10px;background:#eef0f7;color:#737b91;text-align:center;font-size:12px;font-weight:800}.step.on{background:#605ce2;color:white}.result{border-radius:20px;background:#f0fff8;border:1px solid #b9ebd3;padding:23px;margin:20px 0}.score{font-size:42px;font-weight:900;color:#514dca}.mini{color:#788197;font-size:13px}.choice-letter{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#eff0fa;margin-right:8px;font-weight:900}.footer{margin-top:25px;text-align:center;color:#9aa1b2;font-size:12px}.tag{display:inline-block;border-radius:999px;background:#e9e9ff;color:#5e5cc4;padding:5px 10px;font-size:12px;font-weight:800;margin-right:5px}.review{border-left:3px solid #8c88ea;padding:10px 16px;margin:12px 0;background:#f7f7fe;border-radius:0 12px 12px 0}.progress{height:7px;border-radius:99px;background:#e8e9f5;overflow:hidden;margin-bottom:20px}.progress div{height:100%;background:#7771e8;transition:width .2s}.muted{color:#65718a}.notice{font-size:14px;color:#6c738a}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn{flex:1}@media(max-width:620px){.grid{grid-template-columns:1fr}.choice{min-height:85px}.panel{border-radius:20px}.step{font-size:10px}.title{font-size:30px}}
</style></head><body><div id="app" class="wrap"></div><script>const DATA={"issues":[{"id":"food","name":"급식 잔반","desc":"먹을 만큼 받고, 남김은 줄이기","emoji":"🍱"},{"id":"waste","name":"분리배출","desc":"쓰레기가 제대로 분리되는 학교","emoji":"♻️"},{"id":"event","name":"학교 행사 참여","desc":"더 많은 학생이 함께하는 행사","emoji":"🎪"},{"id":"library","name":"도서관 소음","desc":"집중과 공동 학습이 공존하는 공간","emoji":"📚"}],"methods":["조사","홍보","참여","협력"],"actions":{"food":["학급별 잔반 발생 이유 설문","먹을 만큼 받기 안내 캠페인","학생 자율 잔반 줄이기 주간","영양교사와 배식 개선 협의"],"waste":["쓰레기 발생 위치·종류 조사","분리배출 안내 포스터","학생 분리배출 실천단","시설 담당자와 수거 체계 협의"],"event":["학년별 불참 이유 설문","행사 프로그램 홍보","학생 제안 프로그램 운영","학생회·교사와 일정 협의"],"library":["시간대별 이용 실태 조사","조용한 이용 문화 캠페인","학생 자율 이용 약속 만들기","담당 교사와 이용 규칙 협의"]},"first":[{"id":"food-01-1","issue":"food","methods":[0,1],"situation":"잔반 원인을 조사한 뒤 홍보물을 게시했다. 그러나 글이 많아 학생들이 읽지 않는다. 수정할 시간은 하루뿐이다.","options":[{"text":"핵심 조사 결과를 그림과 짧은 문장으로 다시 제작한다.","score":3,"feedback":"핵심 정보를 유지하면서 전달력을 높인다."},{"text":"기존 홍보물에 눈에 띄는 제목과 핵심 내용을 추가한다.","score":2,"feedback":"빠르게 개선할 수 있지만 내용이 여전히 복잡할 수 있다."},{"text":"기존 홍보물을 여러 장소에 더 게시한다.","score":1,"feedback":"노출은 늘지만 읽기 어렵다는 원인은 해결되지 않는다."}]},{"id":"food-02-1","issue":"food","methods":[0,2],"situation":"잔반 줄이기 주간을 준비했지만 신청자가 적다. 일부 학생은 활동이 귀찮거나 부담스럽다고 말한다.","options":[{"text":"참여자에게 작은 보상을 제공한다.","score":2,"feedback":"관심을 끌지만 보상에 의존할 수 있다."},{"text":"실천 활동을 간단하게 만들고 자율적으로 참여하게 한다.","score":3,"feedback":"참여 부담을 낮추면서 자발성을 확보한다."},{"text":"학급별 참가 목표를 설정한다.","score":1,"feedback":"참여율은 높여도 압박을 줄 수 있다."}]},{"id":"food-03-1","issue":"food","methods":[0,3],"situation":"학생들은 선호 메뉴를 늘리자고 요구하지만 영양교사는 영양 기준과 급식 운영 여건을 설명한다.","options":[{"text":"요구가 많은 메뉴부터 변경 가능성을 검토해 달라고 요청한다.","score":2,"feedback":"요구를 반영하지만 운영 조건 검토가 부족하다."},{"text":"학생 요구와 운영 조건을 함께 검토해 실행 가능한 개선안부터 협의한다.","score":3,"feedback":"학생 의견과 실행 가능성을 함께 고려한다."},{"text":"메뉴 변경 대신 학생들에게 잔반 줄이기만 강조한다.","score":1,"feedback":"메뉴에 대한 불만은 해결되지 않는다."}]},{"id":"food-12-1","issue":"food","methods":[1,2],"situation":"잔반 없는 식판 인증 캠페인에서 일부 학생이 인증을 위해 음식을 지나치게 적게 받거나 친구에게 넘긴다.","options":[{"text":"인증 기준을 강화하고 부적절한 참여는 인정하지 않는다.","score":1,"feedback":"인증 경쟁 자체의 부작용은 남는다."},{"text":"식판 인증 대신 적정량 배식과 건강한 식습관을 실천하는 방식으로 바꾼다.","score":3,"feedback":"활동 목적에 맞게 참여 방식을 개선한다."},{"text":"인증을 유지하되 식사량을 무리하게 줄이지 말라고 안내한다.","score":2,"feedback":"기존 참여는 유지되지만 부작용이 반복될 수 있다."}]},{"id":"food-13-1","issue":"food","methods":[1,3],"situation":"잔반 줄이기 홍보 문구인 '먹을 만큼만 받자'에 대해 영양교사는 식사량을 무조건 줄이라는 뜻으로 오해될 수 있다고 우려한다.","options":[{"text":"영양교사와 함께 적정 배식과 균형 잡힌 식사를 강조하도록 수정한다.","score":3,"feedback":"정확성과 전달력을 함께 확보한다."},{"text":"기존 문구에 영양 섭취 설명을 추가한다.","score":2,"feedback":"설명을 보완하지만 핵심 문구의 오해 가능성이 남는다."},{"text":"기존 문구로 먼저 홍보하고 오해가 생기면 안내한다.","score":1,"feedback":"예상되는 오해를 미리 예방하지 못한다."}]},{"id":"food-23-1","issue":"food","methods":[2,3],"situation":"학생들이 제안한 급식 개선 활동을 영양교사가 검토했으나 인력과 조리 시간 때문에 모두 시행하기 어렵다고 한다.","options":[{"text":"학생들이 가장 원하는 활동 하나를 선정한다.","score":2,"feedback":"선호는 반영하지만 운영 여건 검토가 부족하다."},{"text":"운영 부담이 적은 활동부터 시범 운영한다.","score":3,"feedback":"참여와 실행 가능성을 함께 고려한다."},{"text":"학생 요구를 공식적으로 전달하고 시행을 요청한다.","score":1,"feedback":"요구 전달만으로 실제 변화가 보장되지 않는다."}]},{"id":"waste-01-1","issue":"waste","methods":[0,1],"situation":"쓰레기 조사에서 음료 용기와 일반 쓰레기가 자주 섞였다. 학생들은 분리배출 기준이 복잡하다고 말한다.","options":[{"text":"자주 틀리는 품목을 그림과 예시로 안내한다.","score":3,"feedback":"실제 오류를 이해하기 쉽게 설명한다."},{"text":"자세한 분리배출 기준 안내문을 배포한다.","score":2,"feedback":"정보는 정확하지만 읽기 어려울 수 있다."},{"text":"분리배출의 중요성을 강조하는 캠페인을 진행한다.","score":1,"feedback":"중요성만 알리고 구체적 방법을 알려주지 못한다."}]},{"id":"waste-02-1","issue":"waste","methods":[0,2],"situation":"학급별 분리배출 실천 활동을 준비했지만 학생 수와 쓰레기 배출량이 달라 단순 총량 비교가 불공정하다는 의견이 나왔다.","options":[{"text":"학급 규모와 배출량을 고려해 분리배출 정확도를 평가한다.","score":3,"feedback":"비교 기준의 공정성을 높인다."},{"text":"학급 간 경쟁 대신 각 학급의 개선 정도를 기록한다.","score":2,"feedback":"부담을 줄이지만 개선 정도의 측정 기준이 필요하다."},{"text":"재활용품 총량으로만 비교한다.","score":1,"feedback":"학급별 조건 차이를 반영하지 못한다."}]},{"id":"waste-03-1","issue":"waste","methods":[0,3],"situation":"매점 근처 쓰레기통은 넘치고 복도 끝은 거의 사용되지 않는다. 시설 담당자는 위치 변경 iz":[{"q":"사회문제를 해결하기 위해 가장 먼저 해야 할 일은?","options":["즉시 홍보부터 시작한다","문제의 현황과 원인을 파악한다","보상부터 정한다"],"answer":1,"why":"문제의 원인과 당사자의 상황을 알아야 적절한 해결책을 세울 수 있습니다."},{"q":"시민단체가 다른 사람·기관과 협력하는 주된 이유는?","options":["역할과 자원을 나눠 해결 가능성을 높이기 위해","모든 결정을 상대에게 맡기기 위해","책임을 피하기 위해"],"answer":0,"why":"협력은 각자의 역할과 자원을 연결해 공동의 문제를 해결하는 방법입니다."},{"q":"사회문제 해결 과정의 올바른 순서는?","options":["실행 → 평가 → 문제 발견 → 계획","계획 → 홍보 → 종료 → 문제 발견","문제 발견·분석 → 계획 → 실행 → 평가·개선"],"answer":2,"why":"실행 후 결과를 평가하고 개선하는 과정까지 필요합니다."}]};
const STORE='mission_change_v5_48cards';const blank=()=>({stage:'welcome',issue:null,methods:[],phase:0,selection:null,score1:null,score2:null,answers:[],history:[]});let state=blank(); // 매번 첫 화면에서 시작하며 이전 플레이 기록을 자동으로 복원하지 않는다.
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){/* 일부 파일 미리보기에서는 저장소가 차단됨: 진행은 계속 */}}function set(p){Object.assign(state,p);save();render();try{window.scrollTo(0,0)}catch(e){}}function issue(){return DATA.issues.find(x=>x.id===state.issue)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(t,fn,disabled=false,secondary=false){return `<button class="btn ${secondary?'secondary':''}" ${disabled?'disabled':''} onclick="${fn}">${t}</button>`}function title(k,t,desc){return `<div class="eyebrow">${k}</div><h1 class="title">${t}</h1><p class="lead">${desc}</p>`}function steps(){return `<div class="stepper">${['개인 판단','팀 토론','공동 결정'].map((t,i)=>`<div class="step ${state.phase===i?'on':''}">${i+1}. ${t}</div>`).join('')}</div>`}
function cardData(){if(state.stage==='issue')return DATA.issues.map(x=>({key:x.id,label:x.name,desc:x.desc,emoji:x.emoji}));if(state.stage==='methods')return DATA.methods.map((m,i)=>({key:i,label:m,desc:DATA.actions[state.issue][i],emoji:['🔎','📣','🙋','🤝'][i]}));if(state.stage==='crisis1'||state.stage==='crisis2'){const c=currentCrisis();return c.options.map((o,i)=>({key:i,label:String.fromCharCode(65+i)+'. '+o.text,desc:'',emoji:''}))}if(state.stage==='quiz')return DATA.quiz[state.answers.length].options.map((o,i)=>({key:i,label:String.fromCharCode(65+i)+'. '+o,desc:'',emoji:''}));return []}
function currentCrisis(){if(state.stage==='crisis2')return DATA.second[state.issue+'-'+state.methods.slice().sort().join('')+'-2'];return DATA.first.find(x=>x.issue===state.issue&&x.methods.join(',')===state.methods.slice().sort().join(','))}
function questionText(){if(state.stage==='issue')return '어떤 학교 문제를 해결해 볼까요?';if(state.stage==='methods')return '어떤 두 가지 방법을 함께 활용할까요?';if(state.stage==='crisis1')return '1차 위기: 가장 적절한 대응 방안은 무엇인가?';if(state.stage==='crisis2')return '2차 위기: 가장 적절한 대응 방안은 무엇인가?';return `최종 미션 ${state.answers.length+1}/3`}
function explanation(){if(state.stage==='issue')return '여러분이 중요하다고 생각하는 문제를 각자 하나씩 정해 보세요.';if(state.stage==='methods')return '조사·홍보·참여·협력 중 서로 다른 두 가지를 각자 정해 보세요.';return 'A·B·C 중 가장 적절하다고 생각하는 답을 각자 고르세요.'}
function selected(key){return state.stage==='methods'?state.methods.includes(key):state.selection===key}
function choose(key){if(state.stage==='methods'){let a=state.methods.slice();a=a.includes(key)?a.filter(x=>x!==key):a.length<2?[...a,key]:[a[1],key];set({methods:a})}else set({selection:key})}
function choices(){return `<div class="grid">${cardData().map(x=>`<button class="choice ${selected(x.key)?'selected':''}" data-choice="${esc(String(x.key))}">${x.emoji?`<span class="emoji">${x.emoji}</span>`:''}<strong>${esc(x.label)}</strong>${x.desc?`<small>${esc(x.desc)}</small>`:''}</button>`).join('')}</div>`}
function confirmTeamDecision(){
  if(state.stage==='methods' && state.methods.length!==2){
    alert('해결 방법 카드를 서로 다른 2개 선택한 뒤 확정해 주세요. 현재 '+state.methods.length+'개 선택했습니다.');
    return;
  }
  if(state.stage!=='methods' && state.selection===null){
    alert('우리 팀의 최종 선택지를 먼저 눌러 주세요.');
    return;
  }
  submit();
}
function submit(){if(state.stage==='issue'){if(!state.selection)return;set({issue:state.selection,selection:null,stage:'methods',phase:0});return}if(state.stage==='methods'){if(state.methods.length!==2)return;set({stage:'crisis1',phase:0,selection:null});return}if(state.stage==='crisis1'||state.stage==='crisis2'){if(state.selection===null)return;const c=currentCrisis(),o=c.options[state.selection],h={stage:state.stage,issue:state.issue,choice:state.selection,score:o.score,text:o.text,feedback:o.feedback};set({[state.stage==='crisis1'?'score1':'score2']:o.score,history:[...state.history,h],stage:state.stage==='crisis1'?'feedback1':'feedback2',phase:0,selection:null});return}if(state.stage==='quiz'){if(state.selection===null)return;let i=state.answers.length;set({answers:[...state.answers,state.selection],stage:'quizfeedback',selection:null});return}}
function next(){if(state.stage==='feedback1')set({stage:'crisis2',phase:0});else if(state.stage==='feedback2')set({stage:'quiz',phase:0});else if(state.stage==='quizfeedback')set({stage:state.answers.length===3?'end':'quiz',phase:0})}
function discussionQuestion(){if(state.stage==='issue')return '어떤 문제가 우리 학교에서 더 시급하고, 우리가 해결에 참여할 수 있을까요?';if(state.stage==='methods')return '선택한 두 방법은 서로 어떤 점을 보완할까요?';if(state.stage==='quiz')return '이 답이 맞다고 생각한 근거는 무엇인가요?';return '어떤 선택이 가장 효과적이면서도 현실적으로 실행 가능할까요?'}
function voting(){let q=questionText(),detail=state.stage==='crisis1'||state.stage==='crisis2'?`<div class="crisis"><strong>⚡ ${state.stage==='crisis1'?'첫 번째':'두 번째'} 위기 발생!</strong><p>${esc(currentCrisis().situation)}</p></div>`:state.stage==='quiz'?`<div class="crisis">${esc(DATA.quiz[state.answers.length].q)}</div>`:'';let isMethods=state.stage==='methods';let ready=isMethods?state.methods.length===2:state.selection!==null;return `${title(state.stage==='quiz'?'FINAL QUIZ':state.stage==='crisis1'||state.stage==='crisis2'?'CRISIS RESPONSE':'TEAM PROJECT',q,state.stage==='quiz'?'강의에서 배운 내용을 팀원들과 확인해 보세요.':'각자 생각한 뒤 팀원들과 의견을 조율해 하나의 결정을 내려 보세요.')}${detail}${steps()}${state.phase===0?`<div class="hint"><strong>🧠 먼저 혼자 생각!</strong><br>${explanation()}<br><span class="mini">각자 생각한 뒤 선택지를 눌러 볼 수 있어요. 이 선택은 아직 확정되지 않으며 언제든 바꿀 수 있습니다.</span></div>${choices()}<div class="bar">${btn('개인 판단 완료 → 팀 토론','set({phase:1})')}</div>`:state.phase===1?`<div class="hint"><strong>💬 한 명씩 의견을 말해 보세요.</strong><br>서로 처음 선택한 답을 확인하고, 이유를 짧게 설명해 보세요. 선택지를 눌러 의견을 비교해도 됩니다.<br><br><strong>토론 질문</strong><br>${discussionQuestion()}</div>${choices()}<div class="bar">${btn('이전 단계','set({phase:0})',false,true)}${btn('의견 조율 완료 → 최종 선택','set({phase:2})')}</div>`:`<div class="hint"><strong>🤝 우리 팀의 최종 결정</strong><br>${isMethods?'두 가지 방법을 선택하세요.':'팀이 합의한 답 하나를 선택하세요.'} 선택 전에는 정답이나 점수가 공개되지 않습니다.</div>${choices()}<div class="bar">${btn('토론으로 돌아가기','set({phase:1})',false,true)}${btn('팀 결정 확정', 'confirmTeamDecision()')}</div>`}`}
function feedback(){const h=state.history[state.history.length-1];const pair=state.methods.slice().sort().join('');const card=h.stage==='crisis1'?DATA.first.find(x=>x.issue===state.issue&&x.methods.join(',')===state.methods.slice().sort().join(',')):DATA.second[state.issue+'-'+pair+'-2'];const reviews=card.options.map((o,i)=>`<div style="padding:14px 16px;margin:9px 0;border:2px solid ${i===h.choice?'#605ce2':'#e4e7f0'};border-radius:14px;background:${i===h.choice?'#f1f0ff':'#fff'}"><div style="font-weight:800;margin-bottom:6px">${String.fromCharCode(65+i)} · ${o.score}점 ${i===h.choice?'(우리 팀의 선택)':''}</div><div>${esc(o.text)}</div><div style="margin-top:7px;color:#505b70">${esc(o.feedback)}</div></div>`).join('');return `${title('DECISION REVIEW','우리 팀의 선택','세 가지 대응의 장점과 한계를 비교해 보세요.') }<div class="result"><div class="mini">이번 위기 대응 점수</div><div class="score">${h.score} / 3점</div><p><strong>우리 팀: 선택 ${String.fromCharCode(65+h.choice)}</strong></p></div><h3>선택지별 점수와 해설</h3>${reviews}<div class="hint">이 게임의 점수는 학습을 위한 평가 기준이며, 현실에서 유일한 정답을 의미하지는 않습니다.</div><div class="bar">${btn(state.stage==='feedback1'?'두 번째 위기로':'최종 퀴즈로','next()')}</div>`}
function quizFeedback(){let i=state.answers.length-1,q=DATA.quiz[i],chosen=state.answers[i],correct=chosen===q.answer;return `${title('QUIZ REVIEW',correct?'정답이에요! 🎉':'한 번 더 생각해 볼까요?','팀원들과 정답의 근거를 확인해 보세요.') }<div class="result"><h2>${correct?'1점 획득':'이번 문항 0점'}</h2><p>정답: <strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong></p><p>${esc(q.why)}</p></div><div class="bar">${btn(i===2?'최종 결과 보기':'다음 퀴즈','next()')}</div>`}
function end(){let quizScore=state.answers.filter((a,i)=>a===DATA.quiz[i].answer).length,total=state.score1+state.score2+quizScore,special=total>=7;return `${title('MISSION COMPLETE','프로젝트 완료! '+(special?'🏆':'🌟'),'우리 팀이 어떤 판단을 내렸는지 돌아보세요.') }<div class="result" style="text-align:center"><div class="mini">우리 팀 최종 점수</div><div class="score">${total} / 9점</div><h2>${special?'특별 보상':'일반 보상'}</h2><p>${special?'서로의 의견을 조율하며 좋은 판단을 이어갔어요!':'점수보다 중요한 건 의견을 나누고 함께 결정한 과정이에요.'}</p></div><div class="grid"><div class="choice"><strong>1차 위기</strong><span class="score">${state.score1}</span> / 3점</div><div class="choice"><strong>2차 위기</strong><span class="score">${state.score2}</span> / 3점</div><div class="choice"><strong>최종 퀴즈</strong><span class="score">${quizScore}</span> / 3점</div><div class="choice"><strong>선택한 문제</strong><p>${esc(issue().name)}</p><small>방법: ${state.methods.map(i=>DATA.methods[i]).join(' + ')}</small></div></div><h2>우리 팀의 결정 돌아보기</h2>${state.history.map((h,i)=>`<div class="review"><strong>${i+1}차 위기 · ${String.fromCharCode(65+h.choice)} 선택 (${h.score}점)</strong><p>${esc(h.text)}</p><p class="muted">${esc(h.feedback)}</p></div>`).join('')}<div class="hint"><strong>🎤 결과 공유 질문</strong><br>우리 팀에서 가장 의견이 많이 갈렸던 선택은 무엇인가요? 처음 생각과 최종 결정이 달라진 팀원이 있었나요?</div><div class="bar">${btn('처음부터 다시 하기','restart()')}${btn('결과 인쇄','window.print()',false,true)}</div>`}
function restart(){if(!confirm('게임을 처음부터 다시 시작할까요? 기존 결과가 초기화됩니다.'))return;state=blank();save();render()}
document.addEventListener('click',function(e){const el=e.target.closest('[data-choice]');if(!el)return;const raw=el.getAttribute('data-choice');choose(state.stage==='methods'||state.stage==='crisis1'||state.stage==='crisis2'||state.stage==='quiz'?Number(raw):raw)});
function render(){let s=state.stage,content=s==='welcome'?`${title('MISSION: CHANGE','우리 학교를 바꾸는 선택 🚀','우리 팀이 직접 학교 문제를 선택하고, 해결 전략을 세우고, 예상치 못한 위기를 해결하는 협동 의사결정 게임!')}<div class="grid"><div class="choice"><span class="emoji">🧠</span><strong>개인 판단</strong><small>먼저 각자 생각해 보기</small></div><div class="choice"><span class="emoji">💬</span><strong>팀 토론</strong><small>다른 의견을 듣고 조율하기</small></div><div class="choice"><span class="emoji">🤝</span><strong>공동 결정</strong><small>팀의 답 하나로 좁히기</small></div><div class="choice"><span class="emoji">🎁</span><strong>보상 도전</strong><small>7~9점 특별 / 2~6점 일반</small></div></div><div class="hint">팀당 태블릿 한 대만 있으면 됩니다. 로그인이나 팀원 등록은 필요하지 않아요. 개인의 최초 생각은 앱에 기록하지 않습니다.</div><div class="bar">${btn('게임 시작하기 →',"set({stage:'issue',phase:0})")}</div>`:s==='feedback1'||s==='feedback2'?feedback():s==='quizfeedback'?quizFeedback():s==='end'?end():voting();let n={welcome:0,issue:1,methods:2,crisis1:3,feedback1:3,crisis2:4,feedback2:4,quiz:5,quizfeedback:5,end:6}[s];document.getElementById('app').innerHTML=`<header class="top"><div class="logo">✦ MISSION: CHANGE</div><div class="pill">${s==='end'?'완료!':`진행 ${n}/6`}</div></header><div class="progress"><div style="width:${n/6*100}%"></div></div><main class="panel">${content}</main><div class="footer">청소년 사회참여와 문제 해결 · 팀 협동 학습 게임</div>`}render();
</script></body></html>
